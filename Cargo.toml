[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tests/integration", "xtask"]
default-members = [
    "crates/*",
    "apps/server",
    "apps/arbiter",
    "tests/integration",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
mlua = { git = "https://github.com/mlua-rs/mlua", rev = "a0ad4535fc72ba89967a931c5be57b162b5f0f3f" }
