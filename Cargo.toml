[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/server", "apps/arbiter", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
rbx-base = { path = "crates/rbx-base" }
rbx-math = { path = "crates/rbx-math" }
rbx-reflection = { path = "crates/rbx-reflection" }
rbx-dom = { path = "crates/rbx-dom" }
rbx-format = { path = "crates/rbx-format" }
rbx-physics = { path = "crates/rbx-physics" }
rbx-script = { path = "crates/rbx-script" }
rbx-net = { path = "crates/rbx-net" }
rbx-render = { path = "crates/rbx-render" }
rbx-audio = { path = "crates/rbx-audio" }
rbx-csg = { path = "crates/rbx-csg" }
rbx-platform = { path = "crates/rbx-platform" }
rbx-studio-ui = { path = "crates/rbx-studio-ui" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
