[package]
name = "arbiter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
parking_lot = "0.13.0"
rbx-base = { version = "0.1.0", path = "../../crates/rbx-base" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "process"] }
tracing = "0.1.44"
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
serde_json = "1.0.154"
server = { path = "../server" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync"] }
ureq = { version = "3.5.1", features = ["json"] }
