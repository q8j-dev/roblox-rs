[package]
name = "player"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
rbx-audio = { path = "../../crates/rbx-audio" }
parking_lot = "0.13.0"
rbx-base = { version = "0.1.0", path = "../../crates/rbx-base" }
rbx-dom = { version = "0.1.0", path = "../../crates/rbx-dom" }
rbx-math = { version = "0.1.0", path = "../../crates/rbx-math" }
rbx-net = { version = "0.1.0", path = "../../crates/rbx-net" }
rbx-platform = { version = "0.1.0", path = "../../crates/rbx-platform" }
rbx-render = { version = "0.1.0", path = "../../crates/rbx-render" }
rbx-script = { version = "0.1.0", path = "../../crates/rbx-script" }
tracing = "0.1.44"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["console", "Document", "Element", "HtmlCanvasElement", "Location", "Navigator", "UrlSearchParams", "Window"] }

[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
wasm-bindgen-rayon = "1.3.0"
