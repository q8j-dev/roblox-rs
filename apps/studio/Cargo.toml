[package]
name = "studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = "0.37.0"
egui_stack = "0.25.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
parking_lot = "0.13.0"
pollster = "1.0.1"
rbx-base = { version = "0.1.0", path = "../../crates/rbx-base" }
rbx-dom = { version = "0.1.0", path = "../../crates/rbx-dom" }
rbx-math = { version = "0.1.0", path = "../../crates/rbx-math" }
rbx-platform = { version = "0.1.0", path = "../../crates/rbx-platform" }
rbx-reflection = { version = "0.1.0", path = "../../crates/rbx-reflection" }
rbx-render = { version = "0.1.0", path = "../../crates/rbx-render" }
rbx-script = { version = "0.1.0", path = "../../crates/rbx-script" }
rbx-studio-ui = { version = "0.1.0", path = "../../crates/rbx-studio-ui" }
rfd = "0.18.0"
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
