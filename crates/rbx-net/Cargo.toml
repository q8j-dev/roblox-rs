[package]
name = "rbx-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
parking_lot = "0.13.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rbx-dom = { version = "0.1.0", path = "../rbx-dom" }
rbx-math = { version = "0.1.0", path = "../rbx-math" }
rbx-reflection = { version = "0.1.0", path = "../rbx-reflection" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quinn = "0.11.12"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
