[package]
name = "rbx-physics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
parking_lot = "0.13.0"
parry3d = "0.31.1"
rbx-base = { version = "0.1.0", path = "../rbx-base" }
rbx-csg = { version = "0.1.0", path = "../rbx-csg" }
rbx-dom = { version = "0.1.0", path = "../rbx-dom" }
rbx-math = { version = "0.1.0", path = "../rbx-math" }
rbx-reflection = { version = "0.1.0", path = "../rbx-reflection" }
tracing = "0.1.44"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "step"
harness = false
