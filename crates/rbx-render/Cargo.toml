[package]
name = "rbx-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rbx-csg = { version = "0.1.0", path = "../rbx-csg" }
rustc-hash = "2.1.3"
rbx-base = { version = "0.1.0", path = "../rbx-base" }
bytemuck = { version = "1.25.2", features = ["derive"] }
ddsfile = "0.6.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
rbx-dom = { version = "0.1.0", path = "../rbx-dom" }
rbx-math = { version = "0.1.0", path = "../rbx-math" }
rbx-text = { version = "0.1.0", path = "../rbx-text" }
rbx-reflection = { version = "0.1.0", path = "../rbx-reflection" }
rbx-terrain = { version = "0.1.0", path = "../rbx-terrain" }
texture2ddecoder = "0.1.2"
thiserror = "2.0.21"
tracing = "0.1.44"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl", "webgpu"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[[bench]]
name = "extract"
harness = false
