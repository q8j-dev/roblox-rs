[package]
name = "rbx-script"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
mlua = { version = "0.12.2", features = ["luau", "send", "vendored"] }
parking_lot = "0.13.0"
rbx-base = { version = "0.1.0", path = "../rbx-base" }
rbx-dom = { version = "0.1.0", path = "../rbx-dom" }
rbx-csg = { version = "0.1.0", path = "../rbx-csg" }
rbx-format = { version = "0.1.0", path = "../rbx-format" }
rbx-math = { version = "0.1.0", path = "../rbx-math" }
rbx-net = { version = "0.1.0", path = "../rbx-net" }
rbx-physics = { version = "0.1.0", path = "../rbx-physics" }
rbx-reflection = { version = "0.1.0", path = "../rbx-reflection" }
rbx-text = { version = "0.1.0", path = "../rbx-text" }
serde_json = "1.0.154"
tracing = "0.1.44"
rbx-audio = { path = "../rbx-audio" }

[dev-dependencies]
parking_lot = "0.13.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3.5.1"
